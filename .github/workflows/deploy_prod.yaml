name: Deploy Prod

on:
  push:
    branches:
      - "main"
    paths:
      - "dashboard/**/*"
  workflow_dispatch:

env:
  NODE_VERSION: 24

jobs:
  build_and_deploy:
    name: build-deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        run: npm install

      - name: Run Linter
        run: npm run lint

      - name: Run Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Transfer Build Output
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.CI_EC2_DEPLOY_HOST }}
          username: ubuntu
          key: ${{ secrets.CI_EC2_DEPLOY_KEY }}
          source: dashboard/.output
          target: ~/qaqc-dashboard
          overwrite: true
          tar_dereference: true

      - name: Restart Service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.CI_EC2_DEPLOY_HOST }}
          username: ubuntu
          key: ${{ secrets.CI_EC2_DEPLOY_KEY }}
          envs: GITHUB_SHA
          script: |
            set -e
            cd ~/qaqc-dashboard
            git fetch origin
            git reset --hard $GITHUB_SHA
            cd dashboard
            npm install --omit=dev
            # enable so the service survives a reboot; restart starts it whether
            # or not it was running. Previously a dead service was skipped, so an
            # outage could sit behind a green deploy.
            sudo systemctl enable qaqc-dashboard
            sudo systemctl restart qaqc-dashboard
            # Fail the deploy if the app isn't actually serving.
            for i in $(seq 1 15); do
              if curl -fsS -o /dev/null http://127.0.0.1:3000/api/health; then
                echo "healthy"
                exit 0
              fi
              sleep 2
            done
            echo "qaqc-dashboard failed to become healthy:"
            systemctl status qaqc-dashboard --no-pager -l | head -20
            journalctl -u qaqc-dashboard -n 50 --no-pager
            exit 1
