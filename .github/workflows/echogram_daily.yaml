name: Echogram Plotting
on:
  # Scheduling handled by Prefect (rca-data-tools prefect.yaml, trigger-* deployments).
  # GitHub cron dropped: it ran hours late. Previous cadence: runs after echoharvest completes (was every day 11:07 UTC).
  workflow_dispatch:

jobs:
  instruments:
    uses: ./.github/workflows/instruments.yaml
    with:
      sensor: ZPLSC
  run-echogram_plotting:
    needs: instruments
    name: ${{ matrix.refdes }} echogram plotting
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        refdes: ${{ fromJSON(needs.instruments.outputs.refdes) }}
    steps:
      # dispatch only needs prefect, not the full image - see rca-echo-tools ci/requirements-dispatch.txt
      - uses: actions/checkout@v5
        with:
          repository: ooi-data/rca-echo-tools
      - uses: astral-sh/setup-uv@v6
      - name: Install dispatch env
        run: uv venv --python 3.11 && uv pip install -r ci/requirements-dispatch.txt && uv pip install --no-deps .
      - name: Run echogram plotting
        env:
          PREFECT_WORKSPACE: jdupreyuwedu/ooi-rca-prefect2
          PREFECT_KEY: ${{ secrets.PREFECT_KEY }}
        run: |
          source .venv/bin/activate
          # Authenticate with prefect2 cloud 
          prefect cloud login --key "${{ env.PREFECT_KEY }}" --workspace "${{ env.PREFECT_WORKSPACE }}"
          # Run echogram plotting
          rca-daily-echograms --refdes ${{matrix.refdes}} --ping-time-bin 4s --range-bin 1m --parallel-in-cloud True --s3-sync True