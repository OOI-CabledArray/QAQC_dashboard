name: Echosounder Raw Data Harvest
on:
  # Scheduling handled by Prefect (rca-data-tools prefect.yaml, trigger-* deployments).
  # GitHub cron dropped: it ran hours late. Previous cadence: every day 10:00 UTC (Prefect chains echogram after this completes).
  workflow_dispatch:

jobs:
  run-raw-echo_harvest:
    name: ${{matrix.name}} raw data harvest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - refdes: 'CE04OSPS-PC01B-05-ZPLSCB102'
            name: 'CE04OSPS-PC01B-05-ZPLSCB102'
          - refdes: 'CE02SHBP-MJ01C-07-ZPLSCB101'
            name: 'CE02SHBP-MJ01C-07-ZPLSCB101'
    steps:
      # dispatch only needs prefect, not the full image - see rca-echo-tools ci/requirements-dispatch.txt
      - uses: actions/checkout@v5
        with:
          repository: ooi-data/rca-echo-tools
      - uses: astral-sh/setup-uv@v6
      - name: Install dispatch env
        run: uv venv --python 3.11 && uv pip install -r ci/requirements-dispatch.txt && uv pip install --no-deps .
      - name: Run raw echo data harvest
        env:
          PREFECT_WORKSPACE: jdupreyuwedu/ooi-rca-prefect2
          PREFECT_KEY: ${{ secrets.PREFECT_KEY }}
        run: |
          source .venv/bin/activate
          # Authenticate with prefect2 cloud 
          prefect cloud login --key "${{ env.PREFECT_KEY }}" --workspace "${{ env.PREFECT_WORKSPACE }}"
          # Run echosounder raw data harvest
          rca-echo-harvest --refdes ${{matrix.refdes}} --waveform-mode CW --encode-mode power --sonar-model EK80 --run-type append --cloud True