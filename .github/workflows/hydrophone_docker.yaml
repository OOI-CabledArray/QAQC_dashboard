name: BB Hydrophones (Docker Image)
on:
  # Scheduling handled by Prefect (rca-data-tools prefect.yaml, trigger-* deployments).
  # GitHub cron dropped: it ran hours late. Previous cadence: every day 11:00 UTC.
  workflow_dispatch:

jobs:
  run-acoustic-pipeline:
    name: ${{matrix.name}} spectrograms
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - refdes: 'RS01SLBS-LJ01A-09-HYDBBA102'
            name: 'RS01SLBS-LJ01A-09-HYDBBA102'
          - refdes: 'CE04OSBP-LJ01C-11-HYDBBA105'
            name: 'CE04OSBP-LJ01C-11-HYDBBA105'
          - refdes: "CE02SHBP-LJ01D-11-HYDBBA106"
            name: 'CE02SHBP-LJ01D-11-HYDBBA106'
          - refdes: "RS03AXBS-LJ03A-09-HYDBBA302"
            name: 'RS03AXBS-LJ03A-09-HYDBBA302'
          - refdes: "RS03AXPS-PC03A-08-HYDBBA303"
            name: 'RS03AXPS-PC03A-08-HYDBBA303'
          - refdes: "RS01SBPS-PC01A-08-HYDBBA103"
            name: 'RS01SBPS-PC01A-08-HYDBBA103'
    steps:
      # dispatch only needs prefect, not the full image - see ooi-hyd-tools requirements-dispatch.txt
      - uses: actions/checkout@v5
        with:
          repository: ooi-data/ooi-hyd-tools
      - uses: astral-sh/setup-uv@v6
      - name: Install dispatch env
        run: uv venv --python 3.11 && uv pip install -r requirements-dispatch.txt
      - name: Run acoustic pipeline mseed -> spectrograms
        env:
          PREFECT_WORKSPACE: jdupreyuwedu/ooi-rca-prefect2
          PREFECT_KEY: ${{ secrets.PREFECT_KEY }}
        run: |
          source .venv/bin/activate
          # Authenticate with prefect2 cloud 
          prefect cloud login --key "${{ env.PREFECT_KEY }}" --workspace "${{ env.PREFECT_WORKSPACE }}"
          # Run full acoustic pipeline mseed -> spectrograms
          python -m ooi_hyd_tools.pipeline --hyd-refdes ${{matrix.refdes}} --apply-cals true --s3-sync spectrogram --flag all --runner prefect
