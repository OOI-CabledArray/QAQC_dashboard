name: LF Hydrophones (Docker Image)
on:
  # Scheduling handled by Prefect (rca-data-tools prefect.yaml, trigger-* deployments).
  # GitHub cron dropped: it ran hours late. Previous cadence: every day 11:00 UTC.
  workflow_dispatch:

jobs:
  instruments:
    uses: ./.github/workflows/instruments.yaml
    with:
      sensor: HYDLFA
  run-acoustic-pipeline:
    needs: instruments
    name: ${{ matrix.refdes }} spectrograms
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        refdes: ${{ fromJSON(needs.instruments.outputs.refdes) }}
    steps:
      # dispatch only needs prefect, not the full image - see ooi-hyd-tools ci/requirements-dispatch.txt
      - uses: actions/checkout@v5
        with:
          repository: ooi-data/ooi-hyd-tools
      - uses: astral-sh/setup-uv@v6
      - name: Install dispatch env
        run: uv venv --python 3.11 && uv pip install -r ci/requirements-dispatch.txt
      - name: Run acoustic pipeline mseed -> spectrograms
        env:
          PREFECT_WORKSPACE: jdupreyuwedu/ooi-rca-prefect2
          PREFECT_KEY: ${{ secrets.PREFECT_KEY }}
        run: |
          source .venv/bin/activate
          # Authenticate with prefect2 cloud 
          prefect cloud login --key "${{ env.PREFECT_KEY }}" --workspace "${{ env.PREFECT_WORKSPACE }}"
          # Run full acoustic pipeline with LF flag ooipy -> spectrograms
          python -m ooi_hyd_tools.pipeline --hyd-refdes ${{matrix.refdes}} --flag low_freq --s3-sync spectrogram --runner prefect