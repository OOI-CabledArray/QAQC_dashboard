name: Update QAQC HITL Notes
# NOTE the whole HITL notes process is pretty much deprecated with the new appsheet 
# however the front end hasn't been updated so lets still run this once a week for prod/test
on:
  schedule:
  - cron: "0 12 * * 0" 
  workflow_dispatch:

jobs:
  qaqc-notes:
    name: Run QAQC HITL Notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-duration-seconds: 900
      - name: Checkout rca-data-tools (its uv.lock defines the env)
        uses: actions/checkout@v5
        with:
          repository: OOI-CabledArray/rca-data-tools
          path: rca-data-tools
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: rca-data-tools/uv.lock
      - name: Notes update
        run: |
          uv run --locked --project rca-data-tools generate_hitl_tables --s3-sync --service-json-path ${{ secrets.SERVICE_JSON_PATH }}

