name: QAQC Plots (Daily)
# Run all spans except 365 on tuesday - friday to save on cloud costs.
on:
  # Scheduling handled by Prefect (rca-data-tools prefect.yaml, trigger-* deployments).
  # GitHub cron dropped: it ran hours late. Previous cadence: Tue-Fri 11:00 UTC.
  workflow_dispatch:

env:
  THRESHOLD: 5000000

jobs:
  run-pipeline:
    name: ${{ matrix.name }} Plots
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - span: '1'
            name: 'Daily'
          - span: '7'
            name: 'Weekly'
          - span: '30'
            name: 'Monthly'
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}
      - name: Checkout rca-data-tools (its uv.lock defines the env)
        uses: actions/checkout@v5
        with:
          repository: OOI-CabledArray/rca-data-tools
          path: rca-data-tools
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: rca-data-tools/uv.lock
      - name: Run pipeline plot creation
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          TASK_ROLE_ARN: ${{ secrets.TASK_ROLE_ARN }}
          EXECUTION_ROLE_ARN: ${{ secrets.EXECUTION_ROLE_ARN }}
          PREFECT_WORKSPACE: jdupreyuwedu/ooi-rca-prefect2
          PREFECT_KEY: ${{ secrets.PREFECT_KEY }}
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          # Authenticate with prefect2 cloud 
          uv run --locked --project rca-data-tools prefect cloud login --key "${{ env.PREFECT_KEY }}" --workspace "${{ env.PREFECT_WORKSPACE }}"
          # Run flow
          uv run --locked --project rca-data-tools qaqc_pipeline --stage1 --stage3 --cloud --s3-sync --span ${{ matrix.span }} --run --threshold ${{ env.THRESHOLD }}
