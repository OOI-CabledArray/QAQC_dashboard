name: QAQC Plots Deployment Span

on:
  workflow_dispatch:

env:
  THRESHOLD: 5000000

jobs:
  run-pipeline:
    name: ${{ matrix.name }} Plots
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - span: '0'
            name: 'Deployments'
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}
      # - name: Login to DockerHub
      #   uses: docker/login-action@v1
      #   with:
      #     username: ${{ secrets.DOCKER_USERNAME }}
      #     password: ${{ secrets.DOCKER_TOKEN }}
      - name: Checkout rca-data-tools (its uv.lock defines the env)
        uses: actions/checkout@v5
        with:
          repository: OOI-CabledArray/rca-data-tools
          path: rca-data-tools
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: rca-data-tools/uv.lock
      - name: Run pipeline plot creation
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          TASK_ROLE_ARN: ${{ secrets.TASK_ROLE_ARN }}
          EXECUTION_ROLE_ARN: ${{ secrets.EXECUTION_ROLE_ARN }}
          PREFECT_WORKSPACE: jdupreyuwedu/ooi-rca-prefect2
          PREFECT_KEY: ${{ secrets.PREFECT_KEY }}
        run: |
          # Authenticate with prefect2 cloud 
          uv run --locked --project rca-data-tools prefect cloud login --key "${{ env.PREFECT_KEY }}" --workspace "${{ env.PREFECT_WORKSPACE }}"
          # Run flow
          uv run --locked --project rca-data-tools qaqc_pipeline --stage1 --stage2 --stage3 --cloud --s3-sync --span ${{ matrix.span }} --run --threshold ${{ env.THRESHOLD }}
