name: Seismometers (Weekly)
on:
  # Scheduling handled by Prefect (rca-data-tools prefect.yaml, trigger-* deployments).
  # GitHub cron dropped: it ran hours late. Previous cadence: Monday 11:00 UTC.
  workflow_dispatch:

jobs:
  instruments:
    uses: ./.github/workflows/instruments.yaml
    with:
      sensor: OBS
  run-acoustic-pipeline:
    needs: instruments
    name: ${{ matrix.refdes }} waveform plots
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        refdes: ${{ fromJSON(needs.instruments.outputs.refdes) }}
    steps:
      # dispatch only needs prefect, not the full image - see ooi-hyd-tools ci/requirements-dispatch.txt
      - uses: actions/checkout@v5
        with:
          repository: ooi-data/ooi-hyd-tools
      - uses: astral-sh/setup-uv@v6
      - name: Install dispatch env
        run: uv venv --python 3.11 && uv pip install -r ci/requirements-dispatch.txt
      - name: Run seismometer waveform plots
        env:
          PREFECT_WORKSPACE: jdupreyuwedu/ooi-rca-prefect2
          PREFECT_KEY: ${{ secrets.PREFECT_KEY }}
        run: |
            source .venv/bin/activate
            prefect cloud login --key "${{ env.PREFECT_KEY }}" --workspace "${{ env.PREFECT_WORKSPACE }}"

            python -m ooi_hyd_tools.pipeline \
                --hyd-refdes ${{ matrix.refdes }} \
                --flag obs \
                --s3-sync spectrogram \
                --obs-run-type weekly \
                --runner prefect